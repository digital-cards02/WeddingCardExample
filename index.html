<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Clara &amp; Julian — Digital Wedding Flipbook</title>

    <!-- Open Graph Meta Tags for WhatsApp / Telegram / Social Previews on GitHub Pages -->
    <meta property="og:title" content="Clara & Julian — Wedding Invitation">
    <meta property="og:description" content="Tap to open our interactive 3D luxury wedding booklet, view the schedule, and RSVP.">
    <!-- Google Fonts: Cormorant Garamond, Playfair Display, Plus Jakarta Sans, Alex Brush -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-table: #E6DDD0;
            --bg-table-radial: #F4EFE7;
            --parchment: #FAF6F0;
            --parchment-deep: #F2ECE1;
            --linen-cover: #182620;
            --linen-cover-light: #23362E;
            --ink: #1F2421;
            --ink-muted: #5C554E;
            --gold: #C6A769;
            --gold-foil: #DFC080;
            --brass: #9E7E44;
            --gold-soft: rgba(198, 167, 105, 0.25);
            --sage: #4E665A;
            --sage-light: #E6EFEA;
            --rose: #B98383;
            --rose-light: #F6EBEB;
            --font-serif: 'Cormorant Garamond', 'Playfair Display', Georgia, serif;
            --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-script: 'Alex Brush', cursive;
            --flip-duration: 0.82s;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            background: radial-gradient(circle at 50% 45%, var(--bg-table-radial) 0%, var(--bg-table) 75%, #D9CEC0 100%);
            color: var(--ink);
            font-family: var(--font-sans);
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        /* Subtle woven linen ambient background */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: 
                repeating-linear-gradient(0deg, rgba(24,38,32,0.02) 0px, rgba(24,38,32,0.02) 1px, transparent 1px, transparent 4px),
                repeating-linear-gradient(90deg, rgba(24,38,32,0.02) 0px, rgba(24,38,32,0.02) 1px, transparent 1px, transparent 4px);
            pointer-events: none;
            z-index: 0;
        }

        /* =========================================================
           TOP UTILITY BAR (PAGE INDICATOR + 44PX AUDIO TOGGLE)
        ========================================================== */
        .top-bar {
            position: fixed;
            top: max(10px, env(safe-area-inset-top));
            left: max(14px, env(safe-area-inset-left));
            right: max(14px, env(safe-area-inset-right));
            z-index: 60;
            display: flex;
            align-items: center;
            justify-content: space-between;
            pointer-events: none;
        }

        .top-bar > * {
            pointer-events: auto;
        }

        .icon-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 44px;
            min-width: 44px;
            padding: 0 15px;
            border-radius: 999px;
            background: rgba(250, 246, 240, 0.92);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(197, 160, 89, 0.4);
            color: var(--ink);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(24, 38, 32, 0.08);
            transition: all 0.2s ease;
        }

        .icon-pill:hover {
            background: #FFFFFF;
            border-color: var(--gold);
        }

        .page-badge {
            font-family: var(--font-serif);
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: var(--ink);
            background: rgba(250, 246, 240, 0.9);
            backdrop-filter: blur(8px);
            min-height: 38px;
            display: inline-flex;
            align-items: center;
            padding: 0 15px;
            border-radius: 999px;
            border: 1px solid rgba(197, 160, 89, 0.32);
            box-shadow: 0 3px 10px rgba(24, 38, 32, 0.05);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #9E968E;
            transition: background 0.3s;
        }

        .pulse-dot.active {
            background: var(--sage);
            box-shadow: 0 0 0 4px rgba(78, 102, 90, 0.22);
        }

        /* =========================================================
           3D FLIPBOOK VIEWPORT STAGE
        ========================================================== */
        .stage {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: calc(58px + env(safe-area-inset-top)) 12px calc(68px + env(safe-area-inset-bottom));
            perspective: 2200px;
        }

        /* Book Wrapper: Desktop Double-Spread vs Mobile Single-Page */
        .book-viewport {
            position: relative;
            width: min(94vw, 940px);
            height: min(80dvh, 610px);
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* Desktop center-shift when cover is closed vs open spread */
        @media (min-width: 860px) {
            .book-viewport.state-cover {
                transform: translateX(-25%);
            }
            .book-viewport.state-back {
                transform: translateX(25%);
            }
            .book-viewport.state-open {
                transform: translateX(0%);
            }
        }

        /* Stacked Paper Edges & Outer Book Cover Shadow */
        .book-base-shadow {
            position: absolute;
            top: 6px;
            bottom: 6px;
            left: 50%;
            right: 4px;
            border-radius: 4px 16px 16px 4px;
            box-shadow: 0 24px 55px rgba(24, 38, 32, 0.26), 0 8px 20px rgba(24, 38, 32, 0.14);
            pointer-events: none;
            transition: all 0.6s ease;
        }

        .book-viewport.state-open .book-base-shadow {
            left: 4px;
            right: 4px;
            border-radius: 16px;
            background: linear-gradient(90deg, 
                #E0D5C5 0px, #FAF6F0 3px, #E5DBD0 5px, #FAF6F0 8px, 
                transparent 12px, transparent calc(100% - 12px),
                #FAF6F0 calc(100% - 8px), #E5DBD0 calc(100% - 5px), #FAF6F0 calc(100% - 3px), #E0D5C5 100%);
        }

        /* =========================================================
           DESKTOP 3D DOUBLE-SPREAD SHEET ENGINE (>= 860px)
        ========================================================== */
        .book-sheets {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
        }

        .sheet {
            position: absolute;
            top: 0;
            left: 50%;
            width: 50%;
            height: 100%;
            transform-origin: left center;
            transform-style: preserve-3d;
            transition: transform var(--flip-duration) cubic-bezier(0.645, 0.045, 0.355, 1);
            cursor: pointer;
        }

        .sheet.flipped {
            transform: rotateY(-180deg);
        }

        .face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            background-color: var(--parchment);
            background-image: radial-gradient(rgba(197, 160, 89, 0.09) 0.6px, transparent 0.6px);
            background-size: 20px 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 26px;
        }

        /* Front Face (Right-hand page) */
        .face-front {
            border-radius: 3px 16px 16px 3px;
            border: 1px solid rgba(197, 160, 89, 0.38);
            border-left: none;
            box-shadow: inset 18px 0 28px -14px rgba(24, 38, 32, 0.14);
        }

        /* Back Face (Left-hand page when flipped) */
        .face-back {
            transform: rotateY(180deg);
            border-radius: 16px 3px 3px 16px;
            border: 1px solid rgba(197, 160, 89, 0.38);
            border-right: none;
            box-shadow: inset -18px 0 28px -14px rgba(24, 38, 32, 0.14);
        }

        /* Dynamic fold lighting overlay */
        .face::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .sheet.flipping .face-front::after {
            opacity: 1;
            background: linear-gradient(90deg, rgba(0,0,0,0.12) 0%, rgba(255,255,255,0.18) 35%, rgba(0,0,0,0.06) 100%);
        }

        .sheet.flipping .face-back::after {
            opacity: 1;
            background: linear-gradient(270deg, rgba(0,0,0,0.12) 0%, rgba(255,255,255,0.18) 35%, rgba(0,0,0,0.06) 100%);
        }

        /* Interactive Page-Corner Peel Hint on Right Pages */
        .corner-curl {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 34px;
            height: 34px;
            background: linear-gradient(135deg, transparent 48%, rgba(197, 160, 89, 0.24) 50%, #EFE7DA 56%, #FFFFFF 100%);
            border-top-left-radius: 8px;
            box-shadow: -2px -2px 5px rgba(24, 38, 32, 0.08);
            transition: all 0.28s ease;
            pointer-events: none;
            z-index: 5;
        }

        .face-front:hover .corner-curl {
            width: 48px;
            height: 48px;
        }

        /* Luxury Deep Forest Linen Hardcover Styling */
        .linen-board {
            background-color: var(--linen-cover);
            background-image: 
                repeating-linear-gradient(45deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 5px),
                repeating-linear-gradient(-45deg, rgba(0,0,0,0.18) 0px, rgba(0,0,0,0.18) 1px, transparent 1px, transparent 5px),
                radial-gradient(circle at 50% 35%, var(--linen-cover-light) 0%, var(--linen-cover) 82%);
            color: var(--parchment);
            border: 1.5px solid var(--gold);
        }

        .gold-foil-text {
            background: linear-gradient(135deg, #F5E5BD 0%, #DFC080 45%, #C5A059 75%, #EAD29B 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* =========================================================
           MOBILE SINGLE-PAGE 3D FLIP ENGINE (< 860px) — FULL SCREEN
        ========================================================== */
        @media (max-width: 859px) {
            .stage {
                padding: calc(52px + env(safe-area-inset-top)) 6px calc(62px + env(safe-area-inset-bottom));
            }
            .book-viewport {
                width: calc(100vw - 12px);
                max-width: 520px;
                height: calc(100dvh - 114px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
                max-height: none;
                min-height: 380px;
            }
            /* Subtle stacked right-edge paper thickness on mobile */
            .book-base-shadow {
                top: 3px;
                bottom: 3px;
                left: 4px;
                right: -3px;
                border-radius: 16px;
                background: repeating-linear-gradient(90deg, #FAF6F0 0px, #FAF6F0 2px, #DFD4C4 2px, #DFD4C4 4px);
                border: 1px solid rgba(198, 167, 105, 0.35);
                box-shadow: 0 18px 42px rgba(24, 38, 32, 0.22);
            }
            .sheet {
                display: none;
            }
            .mobile-deck {
                position: relative;
                width: 100%;
                height: 100%;
                transform-style: preserve-3d;
            }
            .mobile-card {
                position: absolute;
                inset: 0;
                border-radius: 16px;
                background-color: var(--parchment);
                background-image: radial-gradient(rgba(198, 167, 105, 0.09) 0.6px, transparent 0.6px);
                background-size: 20px 20px;
                border: 1px solid rgba(198, 167, 105, 0.42);
                box-shadow: inset 12px 0 20px -12px rgba(24, 38, 32, 0.14);
                padding: 8px;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                transform-origin: left center;
                transition: transform 0.68s cubic-bezier(0.645, 0.045, 0.355, 1), opacity 0.4s ease;
                backface-visibility: hidden;
                overflow: hidden;
            }
            .mobile-card.linen-board {
                background-color: var(--linen-cover);
                color: var(--parchment);
                border: 1.5px solid var(--gold);
            }
            .mobile-card.past {
                transform: rotateY(-120deg);
                opacity: 0;
                pointer-events: none;
            }
            .mobile-card.current {
                transform: rotateY(0deg);
                opacity: 1;
                pointer-events: auto;
                z-index: 10;
            }
            .mobile-card.future {
                transform: rotateY(0deg) scale(0.99);
                opacity: 0;
                pointer-events: none;
                z-index: 1;
            }
        }

        @media (min-width: 860px) {
            .mobile-deck {
                display: none;
            }
        }

        /* =========================================================
           PAGE INTERNAL TYPOGRAPHY & COMPACT UI COMPONENTS
        ========================================================== */
        .inner-frame {
            position: relative;
            width: 100%;
            height: 100%;
            border: 1px solid rgba(198, 167, 105, 0.34);
            border-radius: 12px;
            padding: 16px 16px 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-y: auto;
            touch-action: pan-y;
            -webkit-overflow-scrolling: touch;
        }

        @media (max-width: 859px) {
            .inner-frame {
                padding: 14px 13px 12px;
            }
        }

        .linen-board .inner-frame {
            border: 1px solid rgba(223, 192, 128, 0.45);
        }

        .eyebrow {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--sage);
        }

        .serif-title {
            font-family: var(--font-serif);
            font-weight: 500;
            line-height: 1.08;
            color: var(--ink);
        }

        .divider-ornament {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--gold);
            margin: 4px 0;
        }

        .divider-ornament span {
            height: 1px;
            width: 34px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }

        /* Wax Seal Button (48px+ comfortable touch target) */
        @keyframes sealPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(223, 192, 128, 0.45), 0 10px 24px rgba(0,0,0,0.45); }
            50% { box-shadow: 0 0 0 12px rgba(223, 192, 128, 0), 0 14px 28px rgba(0,0,0,0.55); }
        }

        .wax-seal-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            min-width: 120px;
            min-height: 96px;
            transition: transform 0.25s ease;
        }

        .wax-seal-btn:hover, .wax-seal-btn:active {
            transform: scale(1.04);
        }

        .wax-disc {
            width: 78px;
            height: 78px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #EAD29B, #C5A059 65%, #8E6E30 100%);
            border: 2px solid rgba(250, 246, 240, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: sealPulse 2.8s infinite;
        }

        .wax-ring {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            border: 1px dashed rgba(250, 246, 240, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-serif);
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.06em;
            color: #FAF6F0;
            text-shadow: 0 1px 2px rgba(0,0,0,0.35);
        }

        .open-pill {
            padding: 8px 18px;
            min-height: 36px;
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            background: rgba(223, 192, 128, 0.16);
            border: 1px solid var(--gold-foil);
            color: var(--gold-foil);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        /* Countdown Grid */
        .cd-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            width: 100%;
        }

        .cd-box {
            background: var(--parchment-deep);
            border: 1px solid rgba(197, 160, 89, 0.3);
            border-radius: 10px;
            padding: 7px 3px;
            text-align: center;
        }

        .cd-num {
            display: block;
            font-family: var(--font-serif);
            font-size: clamp(20px, 4.5vw, 24px);
            font-weight: 700;
            line-height: 1;
            color: var(--ink);
        }

        .cd-lbl {
            display: block;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--ink-muted);
            margin-top: 3px;
        }

        /* Tactile Buttons (40px-44px comfortable tap height) */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 40px;
            padding: 8px 13px;
            border-radius: 10px;
            font-family: var(--font-sans);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--linen-cover);
            color: var(--parchment);
        }

        .btn-primary:hover {
            background: var(--sage);
        }

        .btn-sage {
            background: var(--sage);
            color: #FFFFFF;
        }

        .btn-sage:hover {
            background: #3D5247;
        }

        .btn-outline {
            background: #FFFFFF;
            color: var(--ink);
            border-color: rgba(197, 160, 89, 0.45);
        }

        .btn-outline:hover {
            background: var(--parchment-deep);
            border-color: var(--gold);
        }

        /* Timeline Items */
        .timeline-list {
            display: flex;
            flex-direction: column;
            gap: 9px;
            border-left: 1.5px solid rgba(197, 160, 89, 0.42);
            margin-left: 7px;
            padding-left: 14px;
        }

        .tl-item {
            position: relative;
        }

        .tl-dot {
            position: absolute;
            left: -19px;
            top: 4px;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--gold);
            border: 2px solid var(--parchment);
        }

        .tl-time {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.12em;
            color: var(--sage);
            text-transform: uppercase;
        }

        .tl-title {
            font-family: var(--font-serif);
            font-size: clamp(16px, 3.8vw, 18px);
            font-weight: 600;
            color: var(--ink);
        }

        .tl-desc {
            font-size: 11px;
            color: var(--ink-muted);
            line-height: 1.3;
        }

        /* Swatch Dots */
        .swatches {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .swatch {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            font-size: 9px;
            color: var(--ink-muted);
        }

        .swatch i {
            display: block;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 1px solid rgba(0,0,0,0.12);
        }

        /* Forms & Inputs (16px font-size on mobile prevents iOS Safari auto-zoom) */
        .field-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .field-label {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--ink-muted);
        }

        .input-clean {
            width: 100%;
            min-height: 40px;
            padding: 7px 11px;
            border-radius: 9px;
            border: 1px solid rgba(197, 160, 89, 0.42);
            background: #FFFFFF;
            font-family: var(--font-sans);
            font-size: 16px;
            color: var(--ink);
            outline: none;
            transition: border-color 0.2s;
        }

        @media (min-width: 860px) {
            .input-clean {
                font-size: 13px;
                min-height: 36px;
            }
        }

        .input-clean:focus {
            border-color: var(--sage);
        }

        /* Pill Selector Toggles */
        .pill-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .choice-pill {
            min-height: 38px;
            padding: 6px 10px;
            border-radius: 9px;
            border: 1px solid rgba(197, 160, 89, 0.42);
            background: #FFFFFF;
            font-size: 11px;
            font-weight: 600;
            color: var(--ink);
            cursor: pointer;
            transition: all 0.18s ease;
        }

        .choice-pill.selected {
            background: var(--sage);
            border-color: var(--sage);
            color: #FFFFFF;
        }

        .choice-pill.decline.selected {
            background: var(--rose);
            border-color: var(--rose);
            color: #FFFFFF;
        }

        /* Guest Stepper (- / +) */
        .stepper-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 40px;
            background: #FFFFFF;
            border: 1px solid rgba(197, 160, 89, 0.42);
            border-radius: 9px;
            padding: 2px 4px;
        }

        .stepper-btn {
            width: 34px;
            height: 34px;
            border-radius: 7px;
            border: none;
            background: var(--parchment-deep);
            color: var(--ink);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stepper-btn:active {
            background: var(--gold);
            color: #FFFFFF;
        }

        .stepper-val {
            font-size: 13px;
            font-weight: 700;
            color: var(--ink);
        }

        /* Digital Entry Pass Card */
        .entry-pass {
            background: #FFFFFF;
            border: 1.5px dashed var(--gold);
            border-radius: 12px;
            padding: 13px;
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        /* Interactive Tap-to-Flip Keepsake Gift Card */
        .gift-flip-container {
            perspective: 1000px;
            width: 100%;
            min-height: 200px;
            cursor: pointer;
        }

        .gift-flip-inner {
            position: relative;

    <!-- =========================================================
         FLIPBOOK ENGINE, AUDIO SYNTHESIZER & WEDDING INTERACTIVITY
    ========================================================== -->
    <script>
        // Default Configuration (Baked into exported index.html for GitHub Pages)
        const DEFAULT_CONFIG = {
            partner1: "Clara",
            partner2: "Julian",
            monogram: "C & J",
            datetime: "2027-09-18T16:00",
            venue: "The Conservatory at Botanica",
            address: "88 Botanical Gardens Way, Kuala Lumpur 50480",
            mapUrl: "https://maps.google.com/?q=Perdana+Botanical+Garden+Kuala+Lumpur",
            dressCode: "Garden Cocktail & Earthy Pastels",
            hashtag: "#ClaraAndJulian2027",
            bankName: "Maybank Premier",
            accountNumber: "5140 8821 9044",
            blessingNote: "With warmest wishes for a lifetime of love, laughter, and home together."
        };

        // Load Config from URL Hash (#data=...), LocalStorage, or DEFAULT_CONFIG
        function loadInitialConfig() {
            try {
                const hash = window.location.hash || "";
                if (hash.startsWith("#data=")) {
                    const encoded = hash.slice(6);
                    const json = decodeURIComponent(escape(atob(encoded)));
                    return { ...DEFAULT_CONFIG, ...JSON.parse(json) };
                }
                const saved = localStorage.getItem("flipbook_wedding_cfg_v1");
                if (saved) {
                    return { ...DEFAULT_CONFIG, ...JSON.parse(saved) };
                }
            } catch (e) {
                console.warn("Using default wedding config", e);
            }
            return { ...DEFAULT_CONFIG };
        }

        let config = loadInitialConfig();

        // Guestbook & RSVP State
        const INITIAL_WISHES = [
            { name: "Eleanor & David", attending: true, text: "Wishing you both a lifetime of morning coffees, spontaneous road trips, and endless laughter!" },
            { name: "Sophia Chen", attending: true, text: "Counting down the days until we celebrate under the conservatory glass! So happy for you two." },
            { name: "Marcus Vance", attending: false, text: "Sending warmest blessings from London. Raising a glass to Clara & Julian!" }
        ];

        let wishes = JSON.parse(localStorage.getItem("flipbook_wishes_v1")) || INITIAL_WISHES;
        let savedRsvp = JSON.parse(localStorage.getItem("flipbook_rsvp_v1")) || null;
        let giftCardFlipped = false;

        // Flipbook State
        let desktopSpread = 0;
        let mobilePage = 0;
        let isDesktop = window.innerWidth >= 860;

        // =========================================================
        // WEB AUDIO API: SYNTHESIZED PAGE-RUSTLE & AMBIENT MUSIC BOX
        // =========================================================
        let audioCtx = null;
        let soundEnabled = false;
        let musicTimer = null;
        const MELODY_NOTES = [523.25, 659.25, 783.99, 987.77, 1174.66, 987.77, 783.99, 659.25];
        let melodyStep = 0;

        function ensureAudioContext() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) audioCtx = new AudioContextClass();
            }
            if (audioCtx && audioCtx.state === "suspended") {
                audioCtx.resume();
            }
        }

        function playPageFlipSound() {
            if (!soundEnabled || !audioCtx) return;
            try {
                const duration = 0.22;
                const bufferSize = Math.floor(audioCtx.sampleRate * duration);
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    const env = Math.sin((i / bufferSize) * Math.PI);
                    data[i] = (Math.random() * 2 - 1) * env * 0.32;
                }

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                const filter = audioCtx.createBiquadFilter();
                filter.type = "bandpass";
                filter.frequency.setValueAtTime(1100, audioCtx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(2400, audioCtx.currentTime + duration);
                filter.Q.value = 1.4;

                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                noise.start();
            } catch (e) {}
        }

        function playMusicBoxNote(freq) {
            if (!soundEnabled || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = "sine";
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.032, audioCtx.currentTime + 0.07);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 2.0);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 2.1);
            } catch (e) {}
        }

        function setSoundState(enable) {
            soundEnabled = enable;
            const dot = document.getElementById("audio-dot");
            const lbl = document.getElementById("audio-label");
            if (soundEnabled) {
                ensureAudioContext();
                dot.classList.add("active");
                lbl.textContent = "Sound On";
                if (!musicTimer) {
                    playMusicBoxNote(MELODY_NOTES[melodyStep % MELODY_NOTES.length]);
                    melodyStep++;
                    musicTimer = setInterval(() => {
                        if (soundEnabled) {
                            playMusicBoxNote(MELODY_NOTES[melodyStep % MELODY_NOTES.length]);
                            melodyStep++;
                        }
                    }, 1550);
                }
            } else {
                dot.classList.remove("active");
                lbl.textContent = "Sound Off";
                clearInterval(musicTimer);
                musicTimer = null;
            }
        }

        document.getElementById("audio-toggle-btn").addEventListener("click", () => {
            setSoundState(!soundEnabled);
        });

        // =========================================================
        // TOAST & CLIPBOARD HELPERS
        // =========================================================
        let toastTimeout = null;
        function showToast(text) {
            const toast = document.getElementById("toast");
            toast.textContent = text;
            toast.classList.add("show");
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove("show"), 2600);
        }

        function copyToClipboard(text, message) {
            const ta = document.createElement("textarea");
            ta.value = text;
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand("copy");
                showToast(message);
            } catch (e) {
                showToast("Copied!");
            }
            document.body.removeChild(ta);
        }

        function escapeHtml(str) {
            const d = document.createElement("div");
            d.textContent = str;
            return d.innerHTML;
        }

        function formatWeddingDate(iso) {
            const d = new Date(iso);
            if (isNaN(d.getTime())) return "Saturday, September 18, 2027 • 4:00 PM";
            const datePart = d.toLocaleDateString("en-US", {
                weekday: "long",
                month: "long",
                day: "numeric",
                year: "numeric"
            });
            const timePart = d.toLocaleTimeString("en-US", {
                hour: "numeric",
                minute: "2-digit"

        function buildGoogleCalendarUrl() {
            const start = new Date(config.datetime);
            if (isNaN(start.getTime())) return "https://calendar.google.com";
            const end = new Date(start.getTime() + 5 * 60 * 60 * 1000);
            const fmt = (d) => d.toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
            const title = `${config.partner1} & ${config.partner2} Wedding`;
            const loc = `${config.venue}, ${config.address}`;
            return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${fmt(start)}/${fmt(end)}&details=${encodeURIComponent("We look forward to celebrating with you!")}&location=${encodeURIComponent(loc)}`;
        }

        function downloadIcsFile() {
            const start = new Date(config.datetime);
            const end = new Date(start.getTime() + 5 * 60 * 60 * 1000);
            const fmt = (d) => isNaN(d.getTime()) ? "20270918T080000Z" : d.toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
            const couple = `${config.partner1} & ${config.partner2}`;
            const ics = [
                "BEGIN:VCALENDAR",
                "VERSION:2.0",
                "PRODID:-//Wedding Flipbook//EN",
                "BEGIN:VEVENT",
                `DTSTART:${fmt(start)}`,
                `DTEND:${fmt(end)}`,
                `SUMMARY:${couple} Wedding`,
                `LOCATION:${config.venue}, ${config.address}`,
                `DESCRIPTION:Wedding celebration of ${couple}.`,
                "END:VEVENT",
                "END:VCALENDAR"
            ].join("\r\n");

            const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `${config.partner1}_${config.partner2}_Wedding.ics`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast("Saved .ICS calendar invite!");
        }

        // =========================================================
        // RENDER ALL PAGES INTO DESKTOP & MOBILE CONTAINERS
        // =========================================================
        function renderBookContents() {
            document.title = `${config.partner1} & ${config.partner2} — Digital Wedding Flipbook`;
            const templates = buildPageTemplates();

            document.querySelectorAll("[data-page-slot]").forEach(el => {
                const slot = Number(el.dataset.pageSlot);
                el.innerHTML = templates[slot];
            });

            document.querySelectorAll("[data-mobile-slot]").forEach(el => {
                const slot = Number(el.dataset.mobileSlot);
                el.innerHTML = templates[slot];
            });

            updateCountdownDisplays();
            bindDynamicPageEvents();
        }

        // =========================================================
        // 3D FLIPBOOK NAVIGATION & SPREAD CONTROLLER
        // =========================================================
        function updateBookVisualState(playSound = true) {
            isDesktop = window.innerWidth >= 860;
            const viewport = document.getElementById("book-viewport");
            const sheets = document.querySelectorAll(".sheet");
            const mobileCards = document.querySelectorAll(".mobile-card");
            const indicator = document.getElementById("page-indicator");
            const prevBtn = document.getElementById("prev-btn");
            const nextBtn = document.getElementById("next-btn");

            if (playSound) playPageFlipSound();

            if (isDesktop) {
                viewport.classList.remove("state-cover", "state-open", "state-back");
                if (desktopSpread === 0) viewport.classList.add("state-cover");
                else if (desktopSpread === 4) viewport.classList.add("state-back");
                else viewport.classList.add("state-open");

                sheets.forEach((sheet, idx) => {
                    const shouldFlip = idx < desktopSpread;
                    const wasFlipped = sheet.classList.contains("flipped");
                    if (shouldFlip !== wasFlipped) {
                        sheet.classList.add("flipping");
                        setTimeout(() => sheet.classList.remove("flipping"), 820);
                    }
                    sheet.classList.toggle("flipped", shouldFlip);
                    sheet.style.zIndex = shouldFlip ? (idx + 1) : (sheets.length - idx + 4);
                });

                const labels = ["Cover", "Pages 1 – 2", "Pages 3 – 4", "Pages 5 – 6", "Back Cover"];
                indicator.textContent = labels[desktopSpread] || "Cover";
                prevBtn.disabled = desktopSpread === 0;
                nextBtn.disabled = desktopSpread === 4;
            } else {
                viewport.classList.remove("state-cover", "state-open", "state-back");
                mobileCards.forEach((card, idx) => {
                    card.classList.remove("past", "current", "future");
                    if (idx < mobilePage) card.classList.add("past");
                    else if (idx === mobilePage) card.classList.add("current");
                    else card.classList.add("future");
                });

                const mobileLabels = [
                    "Cover",
                    "Page 1 of 8 · Invitation",
                    "Page 2 of 8 · Schedule",
                    "Page 3 of 8 · Venue",
                    "Page 4 of 8 · RSVP",
                    "Page 5 of 8 · Gift",
                    "Page 6 of 8 · Guestbook",
                    "Closing"
                ];
                indicator.textContent = mobileLabels[mobilePage] || `Page ${mobilePage + 1} of 8`;
                prevBtn.disabled = mobilePage === 0;
                nextBtn.disabled = mobilePage === 7;
            }

            syncActiveNavigation();
        }

        function syncActiveNavigation() {
            // Sync Desktop Ribbon
            let activeChapter = "cover";
            if (isDesktop) {
                if (desktopSpread === 0) activeChapter = "cover";
                else if (desktopSpread === 1) activeChapter = "invite";
                else if (desktopSpread === 2) activeChapter = "venue";
                else if (desktopSpread === 3) activeChapter = "gift";
                else activeChapter = "guestbook";
            } else {
                const map = ["cover", "invite", "schedule", "venue", "rsvp", "gift", "guestbook", "guestbook"];
                activeChapter = map[mobilePage] || "cover";
            }

            document.querySelectorAll(".ribbon-tab").forEach(btn => {
                btn.classList.toggle("active", btn.dataset.target === activeChapter);
            });

            // Sync Mobile 8-Dot Selector
            document.querySelectorAll(".page-dot-btn").forEach(dot => {
                dot.classList.toggle("active", Number(dot.dataset.page) === mobilePage);
            });
        }

        function goNext() {
            if (isDesktop) {
                if (desktopSpread < 4) {
                    desktopSpread++;
                    mobilePage = Math.min(7, desktopSpread * 2 - 1);
                    updateBookVisualState(true);
                }
            } else {
                if (mobilePage < 7) {
                    mobilePage++;
                    desktopSpread = Math.ceil(mobilePage / 2);
                    updateBookVisualState(true);
                }
            }
        }

        function goPrev() {
            if (isDesktop) {
                if (desktopSpread > 0) {
                    desktopSpread--;
                    mobilePage = desktopSpread === 0 ? 0 : desktopSpread * 2 - 1;
                    updateBookVisualState(true);
                }
            } else {
                if (mobilePage > 0) {
                    mobilePage--;
                    desktopSpread = Math.ceil(mobilePage / 2);
                    updateBookVisualState(true);
                }
            }
        }

        function jumpToChapter(chapter) {
            if (isDesktop) {
                const spreadMap = { cover: 0, invite: 1, schedule: 1, venue: 2, rsvp: 2, gift: 3, guestbook: 3 };
                const target = spreadMap[chapter] ?? 0;
                if (target !== desktopSpread) {
                    desktopSpread = target;
                    mobilePage = target === 0 ? 0 : target * 2 - 1;
                    updateBookVisualState(true);
                }
            } else {
                const pageMap = { cover: 0, invite: 1, schedule: 2, venue: 3, rsvp: 4, gift: 5, guestbook: 6 };
                const target = pageMap[chapter] ?? 0;
                if (target !== mobilePage) {
                    mobilePage = target;
                    desktopSpread = Math.ceil(mobilePage / 2);
                    updateBookVisualState(true);
                }
            }
        }

        // Prev / Next & Ribbon / Dot Controls
        document.getElementById("prev-btn").addEventListener("click", goPrev);
        document.getElementById("next-btn").addEventListener("click", goNext);

        document.querySelectorAll(".ribbon-tab").forEach(tab => {
            tab.addEventListener("click", () => jumpToChapter(tab.dataset.target));
        });

        document.querySelectorAll(".page-dot-btn").forEach(dot => {
            dot.addEventListener("click", () => {
                const target = Number(dot.dataset.page);
                if (target !== mobilePage) {
                    mobilePage = target;
                    desktopSpread = Math.ceil(mobilePage / 2);
                    updateBookVisualState(true);
                }
            });
        });

        // Click on desktop sheet edges/non-interactive area to flip pages
        document.querySelectorAll(".sheet").forEach(sheet => {
            sheet.addEventListener("click", (e) => {
                if (e.target.closest("button, a, input, select, textarea, label, .gift-flip-container")) return;
                const leafIdx = Number(sheet.dataset.leaf);
                if (sheet.classList.contains("flipped")) {
                    desktopSpread = leafIdx;
                    updateBookVisualState(true);
                } else {
                    desktopSpread = leafIdx + 1;
                    updateBookVisualState(true);
                }
            });
        });

        // Keyboard Arrow Left / Right Navigation
        document.addEventListener("keydown", (e) => {
            if (document.getElementById("host-modal").classList.contains("open")) return;
            if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) return;
            if (e.key === "ArrowRight") goNext();
            else if (e.key === "ArrowLeft") goPrev();
        });

        // Touch Swipe Left / Right Gestures + Left/Right Edge Tap Zones on Mobile
        let touchStartX = 0;
        let touchStartY = 0;
        const stageEl = document.getElementById("swipe-stage");

        stageEl.addEventListener("touchstart", (e) => {
            touchStartX = e.changedTouches[0].clientX;
            touchStartY = e.changedTouches[0].clientY;
        }, { passive: true });

        stageEl.addEventListener("touchend", (e) => {
            if (e.target.closest("input, textarea, select, button, a, .ledger-scroll, .gift-flip-container")) return;
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;

            // Horizontal Swipe Gesture
            if (Math.abs(dx) > 42 && Math.abs(dx) > Math.abs(dy) * 1.25) {
                if (dx < 0) goNext();
                else goPrev();
                return;
            }

            // Mobile Left/Right Edge Tap Zones (outer 16% of viewport)
            if (!isDesktop && Math.abs(dx) < 12 && Math.abs(dy) < 12) {
                const vw = window.innerWidth;
                if (touchStartX < vw * 0.16) goPrev();
                else if (touchStartX > vw * 0.84) goNext();
            }
        }, { passive: true });

        window.addEventListener("resize", () => {
            const nowDesktop = window.innerWidth >= 860;
            if (nowDesktop !== isDesktop) {
                isDesktop = nowDesktop;
                updateBookVisualState(false);
            }
        });

        // =========================================================
        // BIND INTERACTIVE ELEMENTS INSIDE BOOK PAGES
        // =========================================================
        function bindDynamicPageEvents() {
            // Wax Seal "Open Invitation" Button
            document.querySelectorAll(".js-open-book").forEach(btn => {
                btn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    setSoundState(true);
                    goNext();
                });
            });

            // Return to Cover
            document.querySelectorAll(".js-restart-book").forEach(btn => {
                btn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    jumpToChapter("cover");
                });
            });

            // Jump to RSVP
            document.querySelectorAll(".js-goto-rsvp").forEach(btn => {
                btn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    jumpToChapter("rsvp");
                });
            });

            // Download .ICS
            document.querySelectorAll(".js-download-ics").forEach(btn => {
                btn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    downloadIcsFile();
                });
            });

            // Copy Address
            document.querySelectorAll(".js-copy-addr").forEach(btn => {
                btn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    copyToClipboard(`${config.venue}, ${config.address}`, "Venue address copied!");
                });
            });

            // Tap-to-Flip Keepsake Gift Card
            document.querySelectorAll("#gift-flip-card").forEach(card => {
                card.addEventListener("click", (e) => {
                    if (e.target.closest(".js-copy-bank")) return;
                    e.stopPropagation();
                    giftCardFlipped = !giftCardFlipped;
                    document.querySelectorAll("#gift-flip-card").forEach(c => c.classList.toggle("flipped", giftCardFlipped));
                });
            });

            // Copy Bank Account
            document.querySelectorAll(".js-copy-bank").forEach(btn => {
                btn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    copyToClipboard(config.accountNumber, "Account number copied!");
                });
            });

            // Copy Hashtag
            document.querySelectorAll(".js-copy-hashtag").forEach(btn => {
                btn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    copyToClipboard(config.hashtag, `Copied ${config.hashtag}!`);
                });
            });

            // Share Card (Native Mobile Share Sheet with Clipboard Fallback)
            document.querySelectorAll(".js-share-card").forEach(btn => {
                btn.addEventListener("click", async (e) => {
                    e.stopPropagation();
                    const shareData = {
                        title: `${config.partner1} & ${config.partner2} — Wedding Invitation`,
                        text: `You are invited to the wedding of ${config.partner1} & ${config.partner2}!`,
                        url: window.location.href
                    };
                    if (navigator.share) {
                        try {
                            await navigator.share(shareData);
                            return;
                        } catch (err) {}
                    }
                    copyToClipboard(window.location.href, "Invitation link copied to share!");
                });
            });

            // RSVP Attendance Toggle Pills
            document.querySelectorAll(".js-att-pill").forEach(pill => {
                pill.addEventListener("click", (e) => {
                    e.stopPropagation();
                    const form = pill.closest("form");
                    form.querySelectorAll(".js-att-pill").forEach(p => p.classList.remove("selected"));
                    pill.classList.add("selected");
                    const isYes = pill.dataset.val === "yes";
                    form.querySelector('input[name="rattending"]').value = pill.dataset.val;
                    const extra = form.querySelector(".js-att-extra");
                    if (extra) extra.style.display = isYes ? "grid" : "none";
                });
            });

            // Guest Count Stepper (- / +)
            document.querySelectorAll(".js-step-minus").forEach(btn => {
                btn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    const group = btn.closest(".field-group");
                    const input = group.querySelector('input[name="rguests"]');
                    const disp = group.querySelector(".js-step-display");
                    const nextVal = Math.max(1, Number(input.value) - 1);
                    input.value = nextVal;
                    disp.textContent = nextVal;
                });
            });

            document.querySelectorAll(".js-step-plus").forEach(btn => {
                btn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    const group = btn.closest(".field-group");
                    const input = group.querySelector('input[name="rguests"]');
                    const disp = group.querySelector(".js-step-display");
                    const nextVal = Math.min(8, Number(input.value) + 1);
                    input.value = nextVal;
                    disp.textContent = nextVal;
                });
            });

            // RSVP Form Submission
            document.querySelectorAll(".js-rsvp-form").forEach(form => {
                form.addEventListener("submit", (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const name = form.querySelector('input[name="rname"]').value.trim();
                    const attending = form.querySelector('input[name="rattending"]').value === "yes";
                    const guests = form.querySelector('input[name="rguests"]').value;
                    const meal = form.querySelector('select[name="rmeal"]').value;
                    const wish = form.querySelector('input[name="rwish"]').value.trim();
                    const passCode = "WD-" + Math.floor(1000 + Math.random() * 9000);

                    savedRsvp = { name, attending, guests, meal, wish, passCode };
                    localStorage.setItem("flipbook_rsvp_v1", JSON.stringify(savedRsvp));

                    wishes.unshift({ name, attending, text: wish });
                    localStorage.setItem("flipbook_wishes_v1", JSON.stringify(wishes));

                    renderBookContents();
                    showToast("RSVP Confirmed & Digital Pass Ready!");
                });
            });

            // Edit RSVP
            document.querySelectorAll(".js-edit-rsvp").forEach(btn => {
                btn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    savedRsvp = null;
                    localStorage.removeItem("flipbook_rsvp_v1");
                    renderBookContents();
                });
            });

            // Save Digital Pass Summary
            document.querySelectorAll(".js-download-pass").forEach(btn => {
                btn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    if (!savedRsvp) return;
                    const summary = `${config.partner1} & ${config.partner2} Wedding Pass\nGuest: ${savedRsvp.name}\nStatus: ${savedRsvp.attending ? "Confirmed (" + savedRsvp.guests + " Guests)" : "Sent Wishes"}\nDietary: ${savedRsvp.meal}\nPass ID: #${savedRsvp.passCode}\nVenue: ${config.venue}`;
                    copyToClipboard(summary, "Digital Entry Pass copied!");
                });
            });

            // Quick Guestbook Sign Form
            document.querySelectorAll(".js-quick-wish-form").forEach(form => {
                form.addEventListener("submit", (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const name = form.querySelector('input[name="wname"]').value.trim();
                    const text = form.querySelector('input[name="wtext"]').value.trim();
                    if (!name || !text) return;
                    wishes.unshift({ name, attending: true, text });
                    localStorage.setItem("flipbook_wishes_v1", JSON.stringify(wishes));
                    renderBookContents();
                    showToast("Blessing added to Guestbook!");
                });
            });
        }

        // =========================================================
        // LIVE COUNTDOWN TIMER
        // =========================================================
        function updateCountdownDisplays() {
            const target = new Date(config.datetime).getTime();
            const diff = Math.max(0, target - Date.now());
            const d = String(Math.floor(diff / (1000 * 60 * 60 * 24))).padStart(2, "0");
            const h = String(Math.floor((diff / (1000 * 60 * 60)) % 24)).padStart(2, "0");
            const m = String(Math.floor((diff / 1000 / 60) % 60)).padStart(2, "0");
            const s = String(Math.floor((diff / 1000) % 60)).padStart(2, "0");

            document.querySelectorAll(".js-cd-d").forEach(el => el.textContent = d);
            document.querySelectorAll(".js-cd-h").forEach(el => el.textContent = h);
            document.querySelectorAll(".js-cd-m").forEach(el => el.textContent = m);
            document.querySelectorAll(".js-cd-s").forEach(el => el.textContent = s);
        }
        setInterval(updateCountdownDisplays, 1000);

        // =========================================================
        // HOST CUSTOMIZER DRAWER (?edit=1 or #edit ONLY) & HTML EXPORTER
        // =========================================================
        const hostModal = document.getElementById("host-modal");

        function openHostCustomizer() {
            document.getElementById("h-p1").value = config.partner1;
            document.getElementById("h-p2").value = config.partner2;
            document.getElementById("h-mono").value = config.monogram;
            document.getElementById("h-dt").value = config.datetime;
            document.getElementById("h-venue").value = config.venue;
            document.getElementById("h-addr").value = config.address;
            document.getElementById("h-map").value = config.mapUrl;
            document.getElementById("h-dress").value = config.dressCode;
            document.getElementById("h-tag").value = config.hashtag;
            document.getElementById("h-bank").value = config.bankName;
            document.getElementById("h-acc").value = config.accountNumber;
            document.getElementById("h-note").value = config.blessingNote || DEFAULT_CONFIG.blessingNote;
            hostModal.classList.add("open");
        }

        function readHostForm() {
            return {
                partner1: document.getElementById("h-p1").value.trim() || DEFAULT_CONFIG.partner1,
                partner2: document.getElementById("h-p2").value.trim() || DEFAULT_CONFIG.partner2,
                monogram: document.getElementById("h-mono").value.trim() || DEFAULT_CONFIG.monogram,
                datetime: document.getElementById("h-dt").value || DEFAULT_CONFIG.datetime,
                venue: document.getElementById("h-venue").value.trim() || DEFAULT_CONFIG.venue,
                address: document.getElementById("h-addr").value.trim() || DEFAULT_CONFIG.address,
                mapUrl: document.getElementById("h-map").value.trim() || DEFAULT_CONFIG.mapUrl,
                dressCode: document.getElementById("h-dress").value.trim() || DEFAULT_CONFIG.dressCode,
                hashtag: document.getElementById("h-tag").value.trim() || DEFAULT_CONFIG.hashtag,
                bankName: document.getElementById("h-bank").value.trim() || DEFAULT_CONFIG.bankName,
                accountNumber: document.getElementById("h-acc").value.trim() || DEFAULT_CONFIG.accountNumber,
                blessingNote: document.getElementById("h-note").value.trim() || DEFAULT_CONFIG.blessingNote
            };
        }

        document.getElementById("close-host-btn").addEventListener("click", () => hostModal.classList.remove("open"));
        hostModal.addEventListener("click", (e) => {
            if (e.target === hostModal) hostModal.classList.remove("open");
        });

        document.getElementById("host-form").addEventListener("submit", (e) => {
            e.preventDefault();
            config = readHostForm();
            localStorage.setItem("flipbook_wedding_cfg_v1", JSON.stringify(config));
            renderBookContents();
            hostModal.classList.remove("open");
            showToast("Flipbook updated!");
        });

        document.getElementById("copy-share-url-btn").addEventListener("click", () => {
            config = readHostForm();
            renderBookContents();
            const json = JSON.stringify(config);
            const encoded = btoa(unescape(encodeURIComponent(json)));
            const baseUrl = window.location.href.split("#")[0].split("?")[0];
            copyToClipboard(`${baseUrl}#data=${encoded}`, "Shareable #data link copied!");
        });

        document.getElementById("download-index-btn").addEventListener("click", () => {
            config = readHostForm();
            renderBookContents();
            hostModal.classList.remove("open");

            const prevSpread = desktopSpread;
            const prevMobile = mobilePage;
            desktopSpread = 0;
            mobilePage = 0;
            updateBookVisualState(false);

            let htmlSource = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
            const cfgRegex = /const DEFAULT_CONFIG = \{[\s\S]*?\};/;
            const bakedConfig = `const DEFAULT_CONFIG = ${JSON.stringify(config, null, 12)};`;
            htmlSource = htmlSource.replace(cfgRegex, bakedConfig);

            desktopSpread = prevSpread;
            mobilePage = prevMobile;
            updateBookVisualState(false);

            const blob = new Blob([htmlSource], { type: "text/html;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "index.html";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast("Downloaded custom index.html for GitHub!");
        });

        // Initial Render & URL ?edit=1 or #edit Check
        renderBookContents();
        updateBookVisualState(false);

        function checkHostEditTrigger() {
            const hasQueryEdit = new URLSearchParams(window.location.search).get("edit") === "1";
            const hasHashEdit = window.location.hash === "#edit";
            if (hasQueryEdit || hasHashEdit) {
                openHostCustomizer();
            }
        }
        checkHostEditTrigger();
        window.addEventListener("hashchange", checkHostEditTrigger);
    </script>
</body>
